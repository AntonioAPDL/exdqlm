name: AutoDESN checkpoint recovery audit
on:
  pull_request:
    paths:
      - '.github/workflows/autodesn-recovery.yaml'
      - 'validation/autodesn/broad_rolling/recovery/audit_checkpoint.R'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Restore and inspect recovered numerical fit
        run: Rscript validation/autodesn/broad_rolling/recovery/audit_checkpoint.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autodesn-checkpoint-recovery-evidence
          path: validation/autodesn/broad_rolling/recovery/audit/
          retention-days: 30
          if-no-files-found: error
