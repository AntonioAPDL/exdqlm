name: AutoDESN remediation native GP64
on:
  push:
    branches: [feature/autodesn-remediation-20261023]
    paths:
      - validation/autodesn/remediation/remote_gp_requests/budget64.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gp64:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [7366321, 7366322, 7366323, 7366324]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /validation/autodesn/remediation/*.py
            /validation/autodesn/remediation/*.jl
            /validation/autodesn/remediation/native_gp_environment/
            /validation/autodesn/nonlinear_heteroscedastic/input/series.csv
          sparse-checkout-cone-mode: false
      - name: Prepare exact Julia and native dependency pins
        run: python3 validation/autodesn/remediation/remote_gp.py prepare --runtime "$RUNNER_TEMP/autodesn-gp"
      - name: Independent 64-particle native calculation
        continue-on-error: true
        run: |
          python3 validation/autodesn/remediation/launch_gp.py \
            --rows 2000 --particles 64 --seed ${{ matrix.seed }} --period-moves 0 --max-seconds 14400 \
            --julia "$RUNNER_TEMP/autodesn-gp/julia-1.10.10/bin/julia" \
            --project "$RUNNER_TEMP/autodesn-gp/AutoGP.jl" \
            --depot "$RUNNER_TEMP/autodesn-gp/depot"
      - name: Preserve numeric outputs and compressed inference log
        if: always()
        run: python3 validation/autodesn/remediation/remote_gp_budget.py --particles 64 --seed ${{ matrix.seed }}
