name: AutoDESN remediation native GP
on:
  push:
    branches: [feature/autodesn-remediation-20261023]
    paths:
      - .github/workflows/autodesn-remediation-gp.yml
      - validation/autodesn/remediation/remote_gp.py
      - validation/autodesn/remediation/native_gp_environment/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gp:
    # Only standard public runners; no paid larger runners or storage actions.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [7366021, 7366022, 7366023, 7366024]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            R
            src
            validation/autodesn/remediation
            validation/autodesn/nonlinear_heteroscedastic/input
          sparse-checkout-cone-mode: true
      - name: Prepare exact Julia and native dependency pins
        run: python3 validation/autodesn/remediation/remote_gp.py prepare --runtime "$RUNNER_TEMP/autodesn-gp"
      - name: Four independent training-only SMC calculations
        continue-on-error: true
        run: |
          python3 validation/autodesn/remediation/launch_gp.py \
            --rows 2000 --particles 16 --seed ${{ matrix.seed }} --period-moves 0 \
            --julia "$RUNNER_TEMP/autodesn-gp/julia-1.10.10/bin/julia" \
            --project "$RUNNER_TEMP/autodesn-gp/AutoGP.jl" \
            --depot "$RUNNER_TEMP/autodesn-gp/depot"
      - name: Preserve checksummed numeric outputs in job log
        if: always()
        run: python3 validation/autodesn/remediation/remote_gp.py export --seed ${{ matrix.seed }}
