            freeze_tau_iters: 50
            freeze_tau_warmup_iters: 50
            tau_local_tol: 0.0005
            min_tau_updates: 2
            force_tau_after_warmup: yes
      priors:
        gamma:
          mu0: 0
          s20: 10
        sigma:
          a: 1
          b: 1
        beta:
          ridge:
            tau2: 20
          rhs_ns:
            tau0: 1.0e-05
            a_zeta: 2.0
            b_zeta: 1.0
            s2: 1.0
            shrink_intercept: no
            intercept_prec: 1.0e-10
            n_inner: 2
            var_floor: 1.0e-08
            init_log_tau: ~
            init_log_lambda: 0.0
            init_log_c2: 0.0
    mcmc:
      n_burn: 5000
      n_mcmc: 20000
      thin: 1
      verbose: yes
      progress_every: 50
      init_from_vb: yes
      vb_warm_start_control:
        method: ldvb
        max_iter: 300
        min_iter_elbo: 80
        n_samp_xi: 1000
        progress_every: 50
        verbose: no
        sigmagam:
          freeze_warmup_iters: 10
          force_after_warmup: yes
          postwarmup_damping: 0.5
          postwarmup_damping_iters: 3
          min_postwarmup_updates: 1
        rhs_trace: yes
        rhs_deep: no
        rhs:
          freeze_tau_iters: 50
          freeze_tau_warmup_iters: 50
          tau_local_tol: 0.0005
          min_tau_updates: 2
          force_tau_after_warmup: yes
      store_latent_draws: no
      store_rhs_draws: no
      transforms:
