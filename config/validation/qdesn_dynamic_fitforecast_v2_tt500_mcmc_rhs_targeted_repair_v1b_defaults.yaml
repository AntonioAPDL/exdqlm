              target_score_low: -0.75
              target_score_high: 0.75
              step_size: 0.015
              width_min: 0.02
              width_max: 1.8
          slice:
            core_update_mode: sigma_then_gamma
            width_gamma: 0.42
            width_sigma: 0.3
            width_rhs_lambda: 0.18
            width_rhs_tau: 0.1
            width_rhs_c2: 0.07
            width_rhs_tau_c2_block: 0.22
            rhs_global_block_update: transformed_tau_c2_block
            rhs_transformed_block_passes: 3
            core_extra_passes: 2
            max_steps_out: 100
            max_shrink: 360
            max_steps_out_sigma: 160
            max_shrink_sigma: 420
      priors:
        gamma:
          mu0: 0
          s20: 10
        sigma:
          a: 1
          b: 1
        beta:
          ridge:
            tau2: 20
          rhs_ns:
            tau0: 1.0e-05
            a_zeta: 2.0
            b_zeta: 1.0
            s2: 1.0
            shrink_intercept: no
            intercept_prec: 1.0e-10
            n_inner: 2
            var_floor: 1.0e-08
