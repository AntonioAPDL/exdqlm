meta:
  study_id: qdesn_dynamic_fitforecast_v2_500obs_mcmc_highalpha_cellwise_v1
  purpose: Case-specific high-alpha calibration around the exact corrected train-only Q-DESN MCMC authorities.
  article_source_policy: Three fresh discovery trajectories are active; dev08 is generated, hashed, and sealed until a candidate passes the discovery gate.

generation:
  output_parent: results/qdesn_mcmc_validation/qdesn_dynamic_fitforecast_v2_500obs_mcmc_highalpha_cellwise_v1/source_replicates
  TT_total: 12000
  TT_warmup: 2000
  TT_main: 10000
  period: 90
  harmonics: [1, 2]
  C0_scale: 0.01
  initial_state_mode: deterministic_m0
  state_noise_sd: [0.005, 0.00002, 0.004, 0.004, 0.003, 0.003]
  families: [gausmix, laplace, normal]
  taus: [0.05, 0.25]
  tail_fit_sizes: [500]
  family_profiles:
    normal:
      level0: 40
      slope0: 0.012
      seasonal:
        harmonic1: {amplitude: 24, phase: 0.35}
        harmonic2: {amplitude: 8, phase: -0.8}
      observation: {normal_sigma: 10}
    laplace:
      level0: 35
      slope0: 0.011
      seasonal:
        harmonic1: {amplitude: 28, phase: -0.15}
        harmonic2: {amplitude: 10, phase: 0.75}
      observation: {laplace_scale: 10}
    gausmix:
      level0: 45
      slope0: 0.014
      seasonal:
        harmonic1: {amplitude: 32, phase: 0.85}
        harmonic2: {amplitude: 12, phase: -1.25}
      observation:
        gausmix_sigma: [0.5, 15]
        gausmix_weights: [0.1, 0.9]
        gausmix_offset: 1

