study_contract:
  core_lane: yes
  id: qdesn_dynamic_fitforecast_v2_tt500_mcmc_postv4_percell_2026_07_27
  description: Post-v4 per-cell reduced-budget MCMC screen for independent Q-DESN/exQ-DESN
    RHS rows still outside the external DQLM/exDQLM tolerance band.
  budget:
    posterior_metric_draws: 100
    vb_sampling_nd_draws: 100
    vb_synthesis_n_samp: 100
    mcmc_n_burn: 2000
    mcmc_n_mcmc: 8000
    mcmc_thin: 1
  vb:
    method: LDVB
    profile_id: qdesn_ldvb_canonical_v1
    sigmagam:
      freeze_warmup_iters: 10
      force_after_warmup: yes
      postwarmup_damping: 0.5
      postwarmup_damping_iters: 3
      min_postwarmup_updates: 1
  mcmc:
    kernel: slice
    require_slice: yes
    require_init_from_vb: yes
    banned_proposals:
    - rw
    - laplace_rw
    sigmagam:
      freeze_burnin_iters: 50
      freeze_only_during_burn: yes
      force_after_warmup: yes
      delay_adapt_until_after_warmup: yes
      delay_laplace_refresh_until_after_warmup: yes
    vb_warm_start:
      method: LDVB
      max_iter: 150
      min_iter_elbo: 40
      n_samp_xi: 500
      sigmagam:
        freeze_warmup_iters: 10
        force_after_warmup: yes
        postwarmup_damping: 0.5
        postwarmup_damping_iters: 3
        min_postwarmup_updates: 1
  screening_policy:
    unit: model_family_tau_likelihood_metric_cell
    parent_design: qdesn_tt500_mcmc_postv4_percell_design_20260727
    candidates_per_cell: 6
    comparison_policy: status_agnostic_metrics_with_status_retained
    promotion_policy: screening_selects_metric_improvements_then_full_confirmation_for_article_claims
    launch_status: prepared_not_launched
  confirmation_budget:
    mcmc_n_burn: 5000
    mcmc_n_mcmc: 20000
    mcmc_thin: 1
    candidates_per_cell: 1
    required_before_article_promotion: yes
  exploration_policy:
    reason: post-v4 per-cell screen avoids global-specification search
    p_over_n_gate: 1.6
    max_proposed_p_over_n: 0.752
    local_tau0_values:
    - 1.0e-07
    - 3.0e-07
    - 1.0e-06
    objective: improve Q-DESN/exQ-DESN RHS MCMC lower-quantile fit and forecast gaps
