study_contract:
  core_lane: yes
  id: qdesn_dynamic_fitforecast_v2_tt500_mcmc_rhs_targeted_repair_v1c_2026_07_24
  description: Full MCMC targeted repair v1c for selected independent Q-DESN/exQ-DESN
    RHS cell-likelihood gaps. This is not article-facing until strict audit and explicit
    promotion.
  budget:
    posterior_metric_draws: 200
    vb_sampling_nd_draws: 200
    vb_synthesis_n_samp: 200
    mcmc_n_burn: 5000
    mcmc_n_mcmc: 20000
    mcmc_thin: 1
  vb:
    method: LDVB
    profile_id: qdesn_ldvb_canonical_v1
    sigmagam:
      freeze_warmup_iters: 10
      force_after_warmup: yes
      postwarmup_damping: 0.5
      postwarmup_damping_iters: 3
      min_postwarmup_updates: 1
  mcmc:
    kernel: slice
    require_slice: yes
    require_init_from_vb: yes
    banned_proposals:
    - rw
    - laplace_rw
    sigmagam:
      freeze_burnin_iters: 50
      freeze_only_during_burn: yes
      force_after_warmup: yes
      delay_adapt_until_after_warmup: yes
      delay_laplace_refresh_until_after_warmup: yes
    vb_warm_start:
      method: LDVB
      max_iter: 150
      min_iter_elbo: 40
      n_samp_xi: 500
      sigmagam:
        freeze_warmup_iters: 10
        force_after_warmup: yes
        postwarmup_damping: 0.5
        postwarmup_damping_iters: 3
        min_postwarmup_updates: 1
