  core_lane: no
  id: qdesn_dynamic_fitforecast_v2_500obs_alpha_rho_topology_v1_mechanism_2026_07_31
  description: Independent Q-DESN/exQ-DESN RHS topology and broad alpha/rho mechanism
    screen. Selection uses three deterministic development trajectories and two reservoir
    replicates. The frozen article trajectory is excluded until full-budget confirmation.
